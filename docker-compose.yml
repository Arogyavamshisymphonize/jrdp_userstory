# Production-shaped local stack against Supabase (DATABASE_URL in .env): the same image Render runs.
# `--profile local-db` adds a throwaway Postgres for tests/CI only; point DATABASE_URL at it yourself.
services:
  db:
    profiles: [local-db]
    image: postgres:17
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      retries: 10

  app:  # API + React UI on one origin: http://localhost:8000. Migrates on start, like on Render.
    image: relay
    build:
      context: .
      args:  # the UI's sign-in must match the API: AUTH_MODE=dev -> dev, AUTH_MODE=oidc -> supabase
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-dev}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    env_file: .env
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
