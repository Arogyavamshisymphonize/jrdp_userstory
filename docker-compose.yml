# Production-shaped local stack against Supabase (DATABASE_URL in .env): the same image Render runs.
# `--profile local-db` adds a throwaway Postgres for tests/CI only; point DATABASE_URL at it yourself.
services:
  db:
    profiles: [local-db]
    image: postgres:17
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      retries: 10

  migrate:
    image: relay
    build: &build
      context: .
      args:
        VITE_AUTH_MODE: ${AUTH_MODE:-oidc}  # the UI's sign-in matches the API's auth mode
    command: python -m src.manage migrate
    env_file: .env

  app:  # API + React UI on one origin: http://localhost:8000
    image: relay
    build: *build
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
